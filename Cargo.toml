[package]
name = "look4"
version = "0.1.0"
edition = "2021"
description = "Verificador rápido de links com VirusTotal para GNOME"
license = "MIT"

[dependencies]
base64 = "0.22"
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.7" }
glib = "0.20"
gio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
futures-channel = "0.3"
keyring = { version = "3", features = ["linux-native"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ksni = { version = "0.3", features = ["blocking"] }
